[project]
name = "rockmyrun"
version = "0.1.0"
description = "AI-powered running music playlist generator with custom vibe profiles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=26.0.0",
    "matplotlib>=3.10.9",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "requests>=2.31.0",
    "scikit-learn>=1.8.0",
    "spotipy>=2.26.0",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "spotipy>=2.26.0",
]
